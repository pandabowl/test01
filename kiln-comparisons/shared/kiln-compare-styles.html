<style>
.sp-compare{clear:both;margin:24px 0 32px;color:#222;line-height:1.55}
.sp-compare .spc-block{margin:0 0 36px}
.sp-compare h2{margin:0 0 10px;font-size:1.6em;line-height:1.25;color:#1f2a6b}
.sp-compare h3{margin:26px 0 8px;font-size:1.2em;line-height:1.3;color:#1f2a6b}
.sp-compare p{margin:0 0 12px}
.sp-compare a{color:#1f2a6b;text-decoration:underline}
.sp-compare .spc-table-wrap{margin:14px 0 8px;border:1px solid #d9dce8;border-radius:8px;overflow:hidden}
.sp-compare table{width:100%;border-collapse:collapse;font-size:14px;margin:0;border:0}
.sp-compare th{background:#1f2a6b;color:#fff;font-weight:700;text-align:left;padding:10px;border:0;vertical-align:bottom;line-height:1.25}
.sp-compare td{padding:10px;border:0;border-top:1px solid #e3e5ee;vertical-align:top}
.sp-compare tbody tr:nth-child(even) td{background:#f6f7fb}
.sp-compare tbody tr.spc-pop td{background:#fff6e5}
.sp-compare td.spc-model{font-weight:700;white-space:nowrap}
.sp-compare td.spc-model span{display:block;font-weight:400;font-size:12px;color:#c8452d}
.sp-compare .spc-num{white-space:nowrap}
.sp-compare .spc-note{font-size:13px;color:#555}
.sp-compare ul.spc-jump{list-style:none;margin:8px 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.sp-compare ul.spc-jump li{margin:0;padding:0}
.sp-compare ul.spc-jump li::before{content:none}
.sp-compare ul.spc-jump a{display:inline-block;padding:6px 14px;border:1px solid #1f2a6b;border-radius:20px;background:#fff;font-size:14px;text-decoration:none}
.sp-compare ul.spc-jump a:hover{background:#f6f7fb}
.sp-compare ul.spc-picks{list-style:none;margin:8px 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.sp-compare ul.spc-picks li{margin:0;padding:12px 14px;border:1px solid #d9dce8;border-left:4px solid #c8452d;border-radius:8px;background:#fff}
.sp-compare ul.spc-picks li::before{content:none}
.sp-compare ul.spc-picks strong{display:block;color:#1f2a6b;margin-bottom:4px}
.sp-compare .spc-decode{margin:8px 0 14px;padding:12px 14px;background:#f6f7fb;border-radius:8px}
.sp-compare .spc-decode ul{list-style:disc;margin:6px 0 0;padding-left:20px}
.sp-compare .spc-decode li{margin:0 0 4px}
.sp-compare .spc-cta{padding:14px 16px;border:1px solid #d9dce8;border-radius:8px;background:#f6f7fb}
.sp-compare .spc-cta p{margin:0}
@media screen and (max-width:749px){
.sp-compare h2{font-size:1.35em}
.sp-compare .spc-table-wrap{border:0;border-radius:0}
.sp-compare table,.sp-compare tbody{display:block;width:100%}
.sp-compare thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sp-compare tr{display:grid;grid-template-columns:1fr 1fr;margin:0 0 12px;border:1px solid #d9dce8;border-radius:8px;overflow:hidden;background:#fff}
.sp-compare tbody tr:nth-child(even) td,.sp-compare tbody tr.spc-pop td{background:transparent}
.sp-compare tr.spc-pop{border-color:#e8b75a}
.sp-compare td,.sp-compare td.spc-num{display:block;min-width:0;padding:7px 12px;border-top:1px solid #eef0f5;text-align:left;white-space:normal}
.sp-compare td::before{content:attr(data-label);display:block;font-size:12px;font-weight:700;color:#1f2a6b}
.sp-compare td[data-label="Inside"],.sp-compare td[data-label="Best for"]{grid-column:1/-1}
.sp-compare td.spc-model{grid-column:1/-1;background:#1f2a6b !important;color:#fff;border-top:0;font-size:15px}
.sp-compare td.spc-model::before{content:none}
.sp-compare td.spc-model a{color:#fff}
.sp-compare td.spc-model span{color:#ffd28a}
}
.sp-compare td.spc-model span.spc-was{color:#666}
@media screen and (max-width:749px){
.sp-compare td.spc-model span.spc-was{color:#dfe3f5}
}
.sp-compare .spc-sub{display:block;font-size:12px;color:#555;white-space:nowrap}
@media screen and (max-width:749px){
.sp-compare .spc-sub{white-space:normal}
}
</style>
